name: UI

# Checks the UI, then builds a multi-arch (amd64 + arm64) image from ui/ and pushes it to GHCR on
# pushes to main and version tags. Pull requests build without pushing. The Node build runs
# natively and the per-arch stage only copies files, so nothing is emulated.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["ui/**", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same major as the Dockerfile's build stage; keep them in sync.
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sonar-ui" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ui
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
